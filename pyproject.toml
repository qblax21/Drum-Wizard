[project]
name = "drumwizard"
version = "0.1.0"
description = "Split a song's drums into individual drum sounds and map them to MIDI / e-drum kits"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "librosa", "mido", "scikit-learn"]

[project.optional-dependencies]
separation = ["demucs", "torch", "torchaudio"]   # stage 1: song -> drum stem
drumsep = ["mdxnet-infer"]                      # optional: split drums into kit pieces (weights licence unclear)
live = ["python-rtmidi", "sounddevice"]          # play samples from an e-drum kit
server = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest"]

[project.scripts]
drumwizard = "drumwizard.cli:main"
drumwizard-ui = "drumwizard.server:main"

[tool.setuptools]
packages = ["drumwizard"]

[tool.setuptools.package-data]
drumwizard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
